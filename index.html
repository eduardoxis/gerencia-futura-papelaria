<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gerência Futura Papelaria</title>
  <meta name="description" content="Painel administrativo da Papelaria Futura.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    :root { --painel-azul: #041651; --painel-azul-claro: #0c3fb7; --painel-fundo: #eef3f9; }
    #modal-admin { padding:0; background:var(--painel-fundo); backdrop-filter:none; }
    #modal-admin .modal__panel--admin { width:100%; max-width:none; height:100vh; max-height:none; display:grid; grid-template-columns:260px minmax(0,1fr); overflow:hidden; border-radius:0; box-shadow:none; transform:none; }
    .admin-sidebar { min-height:0; display:flex; flex-direction:column; background:var(--painel-azul); color:#d7e2ff; overflow-y:auto; }
    .admin-brand { display:flex; align-items:center; gap:.75rem; min-height:86px; padding:1.2rem 1.35rem; border-bottom:1px solid rgba(255,255,255,.1); }
    .admin-brand__logo { width:43px; height:43px; display:grid; place-items:center; flex:0 0 auto; border-radius:10px; background:#fff; color:#0752c8; box-shadow:0 3px 12px rgba(0,0,0,.24); }
    .admin-brand__logo .icon, .admin-brand__logo svg { width:31px; height:31px; }
    .admin-brand h1 { color:#fff; font-size:1rem; line-height:1.1; letter-spacing:-.03em; }
    .admin-brand p { margin:.18rem 0 0; color:#8faeea; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .admin-sidebar .tabs-nav { width:auto; flex:1; display:flex; flex-direction:column; gap:1.25rem; padding:1rem .75rem; border:0; background:transparent; overflow:visible; }
    .admin-sidebar .tabs-nav__list { display:grid; gap:.25rem; }
    .admin-sidebar .tabs-nav button { width:100%; min-height:43px; padding:.68rem .85rem; color:#b9c9ed; border-radius:10px; font-weight:600; }
    .admin-sidebar .tabs-nav button:hover { color:#fff; background:rgba(255,255,255,.09); }
    .admin-sidebar .tabs-nav button.is-active { color:#fff; background:linear-gradient(135deg, #0a4cc9, #0735a0); box-shadow:0 6px 16px rgba(0,42,143,.45); }
    .admin-sidebar .tabs-nav button .nav-icon { color:inherit; }
    .admin-sidebar .tabs-nav__summary { margin-top:auto; background:rgba(255,255,255,.075); border:1px solid rgba(255,255,255,.05); color:#fff; }
    .admin-sidebar .tabs-nav__summary:hover { background:rgba(255,255,255,.12); box-shadow:none; }
    .admin-sidebar .tabs-nav__summary-icon { background:#0b4ec5; color:#fff; box-shadow:none; }
    .admin-sidebar .tabs-nav__summary strong { color:#fff; }
    .admin-sidebar .tabs-nav__summary p { color:#a9bee9; }
    .admin-sidebar .tabs-nav__summary-link { color:#80aeff; }
    .admin-profile { margin-top:auto; padding:1rem; border-top:1px solid rgba(255,255,255,.1); }
    .admin-profile__card { display:flex; align-items:center; gap:.7rem; padding:.85rem; border-radius:12px; background:rgba(255,255,255,.08); }
    .admin-profile__avatar { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; background:#1354ce; color:#fff; font-size:.86rem; font-weight:800; }
    .admin-profile strong, .admin-profile small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .admin-profile strong { color:#fff; font-size:.83rem; }
    .admin-profile small { margin-top:.18rem; color:#8caeea; font-size:.73rem; }
    .admin-exit { width:100%; display:flex; align-items:center; justify-content:center; gap:.45rem; margin-top:.75rem; padding:.68rem .85rem; border:1px solid rgba(255,255,255,.18); border-radius:9px; color:#f8fbff; font-size:.86rem; font-weight:700; }
    .admin-exit:hover { background:rgba(255,255,255,.11); }
    .admin-workspace { min-width:0; min-height:0; display:grid; grid-template-rows:70px minmax(0,1fr); background:var(--painel-fundo); }
    .admin-topbar { display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; background:#fff; border-bottom:1px solid #dce4ee; box-shadow:0 1px 3px rgba(15,37,79,.06); }
    .admin-topbar h2 { color:#14203a; font-size:1.14rem; }
    .admin-topbar__status { width:38px; height:38px; display:grid; place-items:center; color:#61718d; border:1px solid #dce4ee; border-radius:9px; }
    .tabs-content { padding:1.55rem; background:var(--painel-fundo); }
    .tabs-content .admin-panel-head h1 { font-size:1.55rem; color:#15203a; }
    .tabs-content .admin-panel-head p { color:#637898; }
    @media (max-width:980px) {
      #modal-admin .modal__panel--admin { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
      .admin-sidebar { display:grid; grid-template-columns:1fr auto; overflow:visible; }
      .admin-brand { min-height:64px; padding:.75rem 1rem; border-bottom:1px solid rgba(255,255,255,.1); }
      .admin-brand p { display:none; }
      .admin-sidebar .tabs-nav { grid-column:1 / -1; width:100%; flex-direction:row; padding:.65rem .75rem; overflow-x:auto; border-bottom:1px solid rgba(255,255,255,.1); }
      .admin-sidebar .tabs-nav__list { display:flex; }
      .admin-sidebar .tabs-nav button { width:44px; min-width:44px; justify-content:center; padding:.65rem; }
      .admin-sidebar .tabs-nav button .nav-label { display:none; }
      .admin-sidebar .tabs-nav__summary { display:none; }
      .admin-profile { grid-column:2; grid-row:1; padding:.6rem .8rem; border:0; }
      .admin-profile__card { display:none; }
      .admin-exit { width:auto; margin:0; }
      .admin-workspace { grid-template-rows:62px minmax(0,1fr); }
      .admin-topbar { padding:0 1rem; }
      .tabs-content { padding:1rem; }
    }
    @media (max-width:560px) { .admin-brand h1 { font-size:.92rem; } .admin-brand__logo { width:37px; height:37px; } .admin-topbar h2 { font-size:1rem; } .tabs-content { padding:.75rem; } }
  </style>
</head>
<body>
  <div class="modal is-open" id="modal-admin" aria-label="Painel administrativo" aria-modal="true" role="dialog">
    <div class="modal__panel modal__panel--admin">
      <aside class="admin-sidebar">
        <header class="admin-brand"><span class="admin-brand__logo" id="admin-logo-icon"></span><div><h1>Gerência Futura</h1><p>Papelaria Futura</p></div></header>
        <nav class="tabs-nav" aria-label="Seções administrativas">
          <div class="tabs-nav__list">
            <button data-tab-trigger="dashboard" class="is-active"><span class="nav-icon" data-icon="home"></span><span class="nav-label">Dashboard</span></button>
            <button data-tab-trigger="produtos"><span class="nav-icon" data-icon="box"></span><span class="nav-label">Produtos</span></button>
            <button data-tab-trigger="categorias"><span class="nav-icon" data-icon="tag"></span><span class="nav-label">Categorias</span></button>
            <button data-tab-trigger="marcas"><span class="nav-icon" data-icon="tag"></span><span class="nav-label">Marcas</span></button>
            <button data-tab-trigger="etiquetas"><span class="nav-icon" data-icon="bookmark"></span><span class="nav-label">Etiquetas</span></button>
            <button data-tab-trigger="estoque"><span class="nav-icon" data-icon="archive"></span><span class="nav-label">Estoque</span></button>
            <button data-tab-trigger="pedidos"><span class="nav-icon" data-icon="shoppingBag"></span><span class="nav-label">Pedidos</span></button>
            <button data-tab-trigger="historico"><span class="nav-icon" data-icon="clipboardList"></span><span class="nav-label">Histórico</span></button>
            <button data-tab-trigger="usuarios"><span class="nav-icon" data-icon="users"></span><span class="nav-label">Usuários</span></button>
            <button data-tab-trigger="clientes"><span class="nav-icon" data-icon="userPlus"></span><span class="nav-label">Clientes</span></button>
            <button data-tab-trigger="leads"><span class="nav-icon" data-icon="userPlus"></span><span class="nav-label">Leads</span></button>
          </div>
        </nav>
        <footer class="admin-profile"><div class="admin-profile__card"><span class="admin-profile__avatar" id="admin-user-inicial">F</span><div><strong id="admin-user-nome">Administrador</strong><small id="admin-user-email">Acesso administrativo</small></div></div><button class="admin-exit" id="btn-sair-admin" type="button"><span data-icon="logOut"></span>Sair</button></footer>
      </aside>
      <section class="admin-workspace">
        <header class="admin-topbar"><h2 id="admin-page-title">Dashboard</h2><span class="admin-topbar__status" data-icon="bell" aria-label="Notificações"></span></header>
        <main class="tabs-content">
          <div data-tab-panel="dashboard" id="painel-dashboard"></div>
          <div data-tab-panel="produtos" id="painel-produtos" hidden></div>
          <div data-tab-panel="categorias" id="painel-categorias" hidden></div>
          <div data-tab-panel="marcas" id="painel-marcas" hidden></div>
          <div data-tab-panel="etiquetas" id="painel-etiquetas" hidden></div>
          <div data-tab-panel="estoque" id="painel-estoque" hidden></div>
          <div data-tab-panel="pedidos" id="painel-pedidos" hidden></div>
          <div data-tab-panel="historico" id="painel-historico" hidden></div>
          <div data-tab-panel="usuarios" id="painel-usuarios" hidden></div>
          <div data-tab-panel="clientes" id="painel-clientes" hidden></div>
          <div data-tab-panel="leads" id="painel-leads" hidden></div>
        </main>
      </section>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
